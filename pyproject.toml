[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erpl-dlt"
version = "0.1.0"
description = "dlt sources for SAP: tables and CDS views, OData, ODP delta, BW queries and function modules, via the ERPL DuckDB extensions."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "DataZoo GmbH", email = "info@data-zoo.de" }]
keywords = ["dlt", "sap", "duckdb", "erpl", "rfc", "odata", "odp", "bw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "dlt>=1.30,<2",
    "duckdb>=1.5.5,<2",
    "pyarrow>=14",
    "erpl-extensions>=2026.9.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://erpl.io"
Repository = "https://github.com/DataZooDE/erpl-dlt"

[tool.hatch.build.targets.wheel]
packages = ["erpl_dlt"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["erpl_dlt"]
# dlt and duckdb ship partial stubs; their internals are not our contract.
[[tool.mypy.overrides]]
module = ["dlt.*", "duckdb.*", "pyarrow.*", "erpl_extensions.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live SAP system (ERPL_IT=1)"]
