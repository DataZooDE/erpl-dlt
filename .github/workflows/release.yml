name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build package
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Lint and unit test
        run: |
          ruff check erpl_dlt tests
          ruff format --check erpl_dlt tests
          mypy
          pytest tests -q -m "not integration"

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke test package artifact
        run: |
          python -m venv /tmp/smoke-env
          /tmp/smoke-env/bin/pip install --upgrade pip
          /tmp/smoke-env/bin/pip install dist/*.whl
          /tmp/smoke-env/bin/python -c "
          import erpl_dlt
          from erpl_extensions import is_populated, extension_dir
          assert erpl_dlt.__version__ == '2026.9.4', f'Bad version: {erpl_dlt.__version__}'
          assert is_populated(), 'Extensions not populated'
          from erpl_dlt.connection import ErplConnection, default_extension_dir
          assert default_extension_dir()
          with ErplConnection(extensions=('erpl_rfc',)) as con:
              assert con.cursor().execute('SELECT 42').fetchone() == (42,)
          with ErplConnection(extensions=('erpl_web',)) as con:
              assert con.cursor().execute('SELECT 42').fetchone() == (42,)
          print('Package artifact smoke test passed!')
          "
          rm -rf /tmp/smoke-env

      - name: Build and smoke test Docker image
        run: |
          docker build -t erpl-dlt:test .
          docker run --rm erpl-dlt:test -c "import erpl_dlt, duckdb, dlt; from erpl_extensions import is_populated; assert is_populated(); print('Docker image smoke test passed!')"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_REPO="ghcr.io/${OWNER_LC}/erpl-dlt"
          TAG="${GITHUB_REF_NAME#v}"
          docker tag erpl-dlt:test "${GHCR_REPO}:${TAG}"
          docker tag erpl-dlt:test "${GHCR_REPO}:latest"
          docker push "${GHCR_REPO}:${TAG}"
          docker push "${GHCR_REPO}:latest"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/erpl-dlt
    permissions:
      id-token: write        # Trusted Publishing: no API token to store or rotate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
